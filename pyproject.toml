[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eldial"
version = "1.0.0"
description = "Программная система для моделирования электромембранных процессов"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ангольдт И.А." }]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "reportlab>=4.0.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0"]

[project.scripts]
eldial = "eldial.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["eldial*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
